name: mailflow-staging

x-mailflow-env: &mailflow_env
  APP_ENV: staging
  DATABASE_URL: postgresql+psycopg://mailflow:${POSTGRES_PASSWORD}@db:5432/mailflow
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  SESSION_COOKIE_NAME: __Host-mailflow_session
  CSRF_COOKIE_NAME: __Host-mailflow_csrf
  SESSION_DAYS: "7"
  COOKIE_SECURE: "true"
  PASSWORD_RESET_MINUTES: "30"
  MAILFLOW_EXPOSE_RESET_TOKEN: "false"
  MAILFLOW_CSRF_ENABLED: "true"
  MAILFLOW_CSRF_SECRET: ${MAILFLOW_CSRF_SECRET}
  MAILFLOW_SECURITY_SECRET: ${MAILFLOW_SECURITY_SECRET}
  MAILFLOW_ORIGIN_CHECK_ENABLED: "true"
  MAILFLOW_TRUSTED_ORIGINS: https://${MAILFLOW_HOST}
  MAILFLOW_RATE_LIMIT_ENABLED: "true"
  TRUST_PROXY_HEADERS: "true"
  MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  RESEND_API_BASE: ${RESEND_API_BASE:-https://api.resend.com}
  MAILFLOW_WORKER_INTERVAL_SECONDS: "2"
  MAILFLOW_WORKER_BATCH_SIZE: "25"
  MAILFLOW_RETRY_BASE_SECONDS: "30"
  MAILFLOW_RETRY_MAX_SECONDS: "3600"
  MAILFLOW_PROVIDER_TIMEOUT_SECONDS: "20"
  MAILFLOW_DNS_TIMEOUT_SECONDS: "3"
  WEBHOOK_TOLERANCE_SECONDS: "300"
  APP_URL: https://${MAILFLOW_HOST}
  MAILFLOW_PUBLIC_BASE_URL: https://${MAILFLOW_HOST}
  MAILFLOW_UNSUBSCRIBE_SECRET: ${MAILFLOW_UNSUBSCRIBE_SECRET}
  MAILFLOW_SUPPRESSION_SECRET: ${MAILFLOW_SUPPRESSION_SECRET}
  MAILFLOW_REQUIRE_WORKER_HEALTH: "true"
  MAILFLOW_WORKER_STALE_SECONDS: ${MAILFLOW_WORKER_STALE_SECONDS:-15}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mailflow_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *mailflow_env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *mailflow_env
      MAILFLOW_SERVICE_NAME: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      <<: *mailflow_env
      MAILFLOW_SERVICE_NAME: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MAILFLOW_HOST: ${MAILFLOW_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mailflow_staging_caddy_data:/data
      - mailflow_staging_caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    networks: [backend]

networks:
  backend:

volumes:
  mailflow_staging_pgdata:
  mailflow_staging_caddy_data:
  mailflow_staging_caddy_config:
